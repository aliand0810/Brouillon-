<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrat de Bail</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1e40af;--accent2:#dbeafe;--warn:#b45309;--warnbg:#fef3c7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input,textarea{font:inherit}
.btn{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:#fff;color:var(--accent);font-weight:600}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
.btn.small{padding:6px 10px;font-size:.85rem;background:var(--accent2);color:var(--accent)}
header select{border-radius:8px;padding:7px;border:0;max-width:220px}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:20px;padding:20px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}}
form{display:flex;flex-direction:column;gap:14px}
fieldset{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0}
legend{font-weight:700;color:var(--accent);padding:0 6px}
label{display:block;font-size:.82rem;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total{margin-top:10px;padding:10px;border-radius:8px;background:var(--accent2);color:var(--accent);font-weight:700}
.info{margin-top:8px;font-size:.85rem;color:var(--muted)}
#warn{display:none;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.88rem}
#warn ul{margin:4px 0 0;padding-left:18px}
.preview-wrap{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
@media(max-width:900px){.preview-wrap{position:static;max-height:none}}
#contrat{background:#fff;padding:48px 56px;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.08);font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.55}
@media(max-width:600px){#contrat{padding:24px 18px}}
#contrat h2{text-align:center;font-size:20px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.5px}
#contrat .sub{text-align:center;font-size:12px;color:#444;margin-bottom:24px}
#contrat h3{font-size:14px;text-transform:uppercase;border-bottom:1px solid #999;padding-bottom:3px;margin:22px 0 8px}
#contrat p{margin:6px 0}
#contrat .pre{white-space:pre-wrap}
#contrat .blank{color:#b91c1c;background:#fee2e2;padding:0 4px;border-radius:3px}
#contrat ul{margin:4px 0;padding-left:20px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
.sign div{border:1px solid #999;min-height:130px;padding:10px;font-size:13px}
.hidden{display:none}
@media print{
  @page{size:A4;margin:16mm}
  body{background:#fff}
  header,form,#warn{display:none!important}
  main{display:block;padding:0}
  .preview-wrap{position:static;max-height:none;overflow:visible}
  #contrat{box-shadow:none;padding:0;font-size:12pt}
  #contrat .blank{background:none;color:#000}
  h3{break-after:avoid}.sign{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1>📄 Contrat de bail</h1>
  <div class="bar">
    <select id="saved" title="Baux enregistrés"><option value="">— Baux enregistrés —</option></select>
    <button class="btn ghost" id="bNew" type="button">Nouveau</button>
    <button class="btn ghost" id="bDel" type="button">Supprimer</button>
    <button class="btn ghost" id="bSave" type="button">💾 Enregistrer</button>
    <button class="btn" id="bPrint" type="button">🖨️ Imprimer / PDF</button>
  </div>
</header>

<main>
<form id="f" autocomplete="off">
  <fieldset>
    <legend>Type de bail</legend>
    <label>Type de location</label>
    <select name="typeBail" id="typeBail">
      <option value="vide">Logement vide (non meublé)</option>
      <option value="meuble">Logement meublé</option>
      <option value="etudiant">Meublé — bail étudiant (9 mois)</option>
      <option value="mobilite">Bail mobilité (1 à 10 mois)</option>
    </select>
    <div id="motifBox" class="hidden">
      <label>Motif du bail mobilité</label>
      <select name="mobiliteMotif">
        <option>formation professionnelle</option><option>études supérieures</option>
        <option>contrat d'apprentissage</option><option>stage</option>
        <option>engagement volontaire dans le cadre d'un service civique</option>
        <option>mutation professionnelle</option><option>mission temporaire dans le cadre de son activité professionnelle</option>
      </select>
    </div>
  </fieldset>

  <fieldset>
    <legend>Bailleur</legend>
    <label>Qualité</label>
    <select name="bailleurType" id="bailleurType">
      <option value="physique">Personne physique (ou SCI familiale)</option>
      <option value="morale">Personne morale</option>
    </select>
    <label>Nom / Dénomination</label><input name="bailleurNom">
    <label>Adresse</label><input name="bailleurAdresse">
    <label>Téléphone / e-mail</label><input name="bailleurContact">
  </fieldset>

  <fieldset>
    <legend>Locataire(s)</legend>
    <label>Nom(s) et prénom(s)</label><input name="locataireNom" placeholder="ex. Jean Dupont et Marie Martin">
    <label>Téléphone / e-mail</label><input name="locataireContact">
  </fieldset>

  <fieldset>
    <legend>Logement</legend>
    <label>Adresse du logement</label><textarea name="logAdresse" rows="2" placeholder="N°, rue, étage, porte, code postal, ville"></textarea>
    <div class="row">
      <div><label>Type</label>
        <select name="logType"><option>Appartement</option><option>Maison</option><option>Studio</option><option>Chambre</option></select></div>
      <div><label>Surface habitable (m²)</label><input name="logSurface" type="number" min="0" step="0.01"></div>
    </div>
    <div class="row">
      <div><label>Pièces principales</label><input name="logPieces" type="number" min="1"></div>
      <div><label>Annexes (cave, parking…)</label><input name="logAnnexes"></div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Durée et dates</legend>
    <label>Date d'entrée / prise d'effet</label><input name="dateDebut" type="date">
    <div class="row">
      <div><label>Durée</label><input name="dureeVal" type="number" min="1"></div>
      <div><label>Unité</label><select name="dureeUnite"><option value="mois">mois</option><option value="ans">ans</option></select></div>
    </div>
    <div class="info" id="finInfo"></div>
  </fieldset>

  <fieldset>
    <legend>Loyer et charges</legend>
    <div class="row">
      <div><label>Loyer hors charges (€)</label><input name="loyerHC" type="number" min="0" step="0.01"></div>
      <div><label>Charges (€)</label><input name="chargesMontant" type="number" min="0" step="0.01"></div>
    </div>
    <label>Mode de règlement des charges</label>
    <select name="chargesType" id="chargesType">
      <option value="provision">Provision sur charges avec régularisation annuelle</option>
      <option value="forfait">Forfait de charges</option>
    </select>
    <div class="total" id="totalBox">Total charges comprises : 0,00 €</div>
    <div class="row">
      <div><label>Payable le (jour du mois)</label><input name="jourPaiement" type="number" min="1" max="31"></div>
      <div><label>Mode de paiement</label>
        <select name="modePaiement"><option>virement bancaire</option><option>prélèvement automatique</option><option>chèque</option><option>espèces (contre quittance)</option></select></div>
    </div>
    <label>Compte bancaire du bailleur — titulaire</label><input name="titulaireCompte">
    <label>IBAN</label><input name="iban" placeholder="FR76 ....">
    <label>BIC</label><input name="bic">
  </fieldset>

  <fieldset>
    <legend>Dépôt de garantie (caution)</legend>
    <label>Montant (€)</label><input name="depot" type="number" min="0" step="0.01">
    <button class="btn small" type="button" id="bDepot" style="margin-top:8px">Mettre le maximum légal</button>
  </fieldset>

  <fieldset>
    <legend>Signature et clauses</legend>
    <div class="row">
      <div><label>Fait à</label><input name="lieuSignature"></div>
      <div><label>Le</label><input name="dateSignature" type="date"></div>
    </div>
    <label>Nombre d'exemplaires originaux</label><input name="nbExemplaires" type="number" min="1">
    <label>Clauses particulières (facultatif)</label><textarea name="clauses" rows="4"></textarea>
  </fieldset>
</form>

<section class="preview-wrap">
  <div id="warn"></div>
  <article id="contrat"></article>
</section>
</main>

<script>
const f=document.getElementById('f');
const KEY='contratsBail_v1';
const $=id=>document.getElementById(id);

/* ---------- Nombres en lettres ---------- */
const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
const T=['','','vingt','trente','quarante','cinquante','soixante'];
function b100(n){if(n<20)return U[n];const t=Math.floor(n/10),u=n%10;
  if(t===7||t===9){const base=t===7?'soixante':'quatre-vingt',r=n-(t===7?60:80);return base+(t===7&&r===11?' et onze':'-'+U[r]);}
  if(t===8)return u===0?'quatre-vingts':'quatre-vingt-'+U[u];
  return T[t]+(u===0?'':u===1?' et un':'-'+U[u]);}
function b1000(n){const c=Math.floor(n/100),r=n%100;if(!c)return b100(r);
  const s=c===1?'cent':U[c]+' cent'+(r===0?'s':'');return r?s+' '+b100(r):s;}
function words(n){if(n===0)return 'zéro';const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000,p=[];
  if(m)p.push(b1000(m)+' million'+(m>1?'s':''));
  if(k)p.push(k===1?'mille':b1000(k).replace(/cents$/,'cent')+' mille');
  if(r)p.push(b1000(r));return p.join(' ');}
function euroLettres(x){x=Math.round((+x||0)*100);const e=Math.floor(x/100),c=x%100;
  return words(e)+' euro'+(e>1?'s':'')+(c?' et '+words(c)+' centime'+(c>1?'s':''):'');}

/* ---------- Utilitaires ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=(s,ph='…………………')=>s&&String(s).trim()?esc(s):`<span class="blank">${ph}</span>`;
const money=n=>(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
function finDate(start,months){if(!start||!months)return '';const d=new Date(start+'T12:00:00');
  const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));
  d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
function data(){const o={};for(const el of f.elements)if(el.name)o[el.name]=el.value;return o;}
function fill(o){for(const el of f.elements)if(el.name)el.value=o[el.name]??'';render();}

const TYPES={
  vide:{titre:'Contrat de location — logement vide',loi:'Soumis au titre Ier de la loi n° 89-462 du 6 juillet 1989',depotMois:1},
  meuble:{titre:'Contrat de location — logement meublé',loi:'Soumis au titre Ier bis de la loi n° 89-462 du 6 juillet 1989',depotMois:2},
  etudiant:{titre:'Contrat de location meublée — bail étudiant',loi:'Soumis au titre Ier bis de la loi n° 89-462 du 6 juillet 1989 (article 25-7)',depotMois:2},
  mobilite:{titre:'Bail mobilité',loi:'Soumis au titre Ier ter de la loi n° 89-462 du 6 juillet 1989 (articles 25-12 à 25-18)',depotMois:0}
};
function defaultDuree(){const t=f.typeBail.value,m=f.bailleurType.value==='morale';
  if(t==='vide')return m?[6,'ans']:[3,'ans'];if(t==='meuble')return[1,'ans'];if(t==='etudiant')return[9,'mois'];return[6,'mois'];}

/* ---------- Rendu ---------- */
function render(){
  const d=data(),T0=TYPES[d.typeBail];
  $('motifBox').classList.toggle('hidden',d.typeBail!=='mobilite');
  const months=(+d.dureeVal||0)*(d.dureeUnite==='ans'?12:1);
  const fin=finDate(d.dateDebut,months);
  const hc=+d.loyerHC||0,ch=+d.chargesMontant||0,total=hc+ch;
  $('totalBox').textContent='Total charges comprises : '+money(total);
  $('finInfo').innerHTML=fin?`Fin du bail (départ) : <b>${fmtDate(fin)}</b>`:'';

  // Avertissements
  const w=[];
  if(d.typeBail==='vide'&&months&&months<(d.bailleurType==='morale'?72:36))w.push(`Bail vide : durée minimale de ${d.bailleurType==='morale'?'6 ans':'3 ans'} pour un bailleur ${d.bailleurType==='morale'?'personne morale':'personne physique'} (sauf exceptions encadrées par l'article 11).`);
  if(d.typeBail==='meuble'&&months&&months<12)w.push('Bail meublé : durée minimale d\'un an (ou 9 mois pour un étudiant).');
  if(d.typeBail==='mobilite'&&months&&(months<1||months>10))w.push('Bail mobilité : durée comprise entre 1 et 10 mois.');
  if(d.typeBail==='mobilite'&&+d.depot>0)w.push('Bail mobilité : aucun dépôt de garantie ne peut être exigé.');
  if(d.typeBail==='mobilite'&&d.chargesType!=='forfait')w.push('Bail mobilité : les charges doivent être réglées sous forme de forfait.');
  if(T0.depotMois&&hc&&+d.depot>hc*T0.depotMois+0.001)w.push(`Dépôt de garantie supérieur au maximum légal (${T0.depotMois} mois de loyer hors charges = ${money(hc*T0.depotMois)}).`);
  $('warn').style.display=w.length?'block':'none';
  $('warn').innerHTML=w.length?'<b>⚠️ Points à vérifier</b><ul>'+w.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'';

  const reconduction={
    vide:'À son terme, et à défaut de congé délivré dans les formes et délais légaux, le contrat est reconduit tacitement ou renouvelé dans les conditions prévues par la loi du 6 juillet 1989. Le locataire peut donner congé à tout moment avec un préavis de trois mois (réduit à un mois dans les cas prévus par la loi, notamment en zone tendue).',
    meuble:'À son terme, et à défaut de congé délivré dans les formes et délais légaux, le contrat est reconduit tacitement pour une durée d\'un an. Le locataire peut donner congé à tout moment avec un préavis d\'un mois.',
    etudiant:'Le présent bail n\'est pas reconduit tacitement et prend fin à son terme. Le locataire peut donner congé à tout moment avec un préavis d\'un mois.',
    mobilite:'Le bail mobilité n\'est ni renouvelable ni reconductible ; sa durée totale ne peut excéder dix mois. Le locataire peut donner congé à tout moment avec un préavis d\'un mois.'
  }[d.typeBail];

  const annexes=['Dossier de diagnostic technique (DPE, CREP, ERP, diagnostics électricité et gaz le cas échéant)','Notice d\'information relative aux droits et obligations des locataires et des bailleurs','État des lieux d\'entrée'];
  if(d.typeBail!=='vide')annexes.push('Inventaire et état détaillé du mobilier');
  annexes.push('Extraits du règlement de copropriété (le cas échéant)');

  const duree=months?(d.dureeUnite==='ans'?`${d.dureeVal} an${+d.dureeVal>1?'s':''}`:`${d.dureeVal} mois`):'';
  $('contrat').innerHTML=`
  <h2>${T0.titre}</h2>
  <div class="sub">${T0.loi}</div>

  <h3>I. Désignation des parties</h3>
  <p><b>Le bailleur :</b> ${v(d.bailleurNom)} (${d.bailleurType==='morale'?'personne morale':'personne physique'}), demeurant ${v(d.bailleurAdresse)}${d.bailleurContact?', '+esc(d.bailleurContact):''}.</p>
  <p><b>Le(s) locataire(s) :</b> ${v(d.locataireNom)}${d.locataireContact?', '+esc(d.locataireContact):''}.</p>

  <h3>II. Objet du contrat</h3>
  <p>Le bailleur loue au locataire, qui accepte, le logement suivant à usage ${d.typeBail==='mobilite'?'d\'habitation':'d\'habitation principale'} :</p>
  <ul>
    <li>Adresse : <span class="pre">${v(d.logAdresse)}</span></li>
    <li>Type : ${esc(d.logType)}${d.typeBail!=='vide'?' meublé':''}</li>
    <li>Surface habitable : ${v(d.logSurface,'……')} m² — Nombre de pièces principales : ${v(d.logPieces,'……')}</li>
    ${d.logAnnexes?`<li>Locaux et équipements accessoires : ${esc(d.logAnnexes)}</li>`:''}
  </ul>
  ${d.typeBail==='mobilite'?`<p>Le présent bail mobilité est conclu en raison de la situation du locataire, qui justifie être en ${esc(d.mobiliteMotif)} à la date de prise d'effet du bail.</p>`:''}

  <h3>III. Date de prise d'effet et durée</h3>
  <p>Le contrat prend effet le <b>${v(fmtDate(d.dateDebut))}</b>, date d'entrée dans les lieux, pour une durée de <b>${v(duree,'……')}</b>, soit jusqu'au <b>${v(fmtDate(fin))}</b> inclus.</p>
  <p>${reconduction}</p>

  <h3>IV. Conditions financières</h3>
  <p>Loyer mensuel hors charges : <b>${money(hc)}</b> (${euroLettres(hc)}).</p>
  <p>Charges récupérables : <b>${money(ch)}</b> par mois, sous forme ${d.chargesType==='forfait'?'d\'un forfait non révisable en fonction de la consommation réelle':'de provision, avec régularisation annuelle sur justificatifs'}.</p>
  <p><b>Montant total mensuel charges comprises : ${money(total)}</b> (${euroLettres(total)}).</p>
  <p>Le loyer et les charges sont payables mensuellement et d'avance, le <b>${v(d.jourPaiement,'…')}</b> de chaque mois, par ${esc(d.modePaiement)}.</p>
  ${(d.iban||d.titulaireCompte)?`<p>Compte de versement — Titulaire : ${v(d.titulaireCompte)} — IBAN : ${v(d.iban)}${d.bic?' — BIC : '+esc(d.bic):''}</p>`:''}
  ${d.typeBail!=='mobilite'&&d.typeBail!=='etudiant'?'<p>Le loyer pourra être révisé chaque année à la date anniversaire du contrat, selon la variation de l\'Indice de Référence des Loyers (IRL) publié par l\'INSEE.</p>':''}

  <h3>V. Dépôt de garantie</h3>
  ${d.typeBail==='mobilite'
    ?'<p>Conformément à la loi, aucun dépôt de garantie n\'est exigé dans le cadre du bail mobilité.</p>'
    :`<p>Le locataire verse ce jour au bailleur la somme de <b>${money(d.depot)}</b> (${euroLettres(d.depot)}) à titre de dépôt de garantie. Il sera restitué dans un délai d'un mois à compter de la remise des clés si l'état des lieux de sortie est conforme à l'état des lieux d'entrée, de deux mois dans le cas contraire, déduction faite des sommes restant dues.</p>`}

  <h3>VI. Obligations des parties</h3>
  <p>Le bailleur et le locataire sont tenus des obligations prévues aux articles 6 et 7 de la loi du 6 juillet 1989. Le locataire s'engage notamment à payer le loyer et les charges aux termes convenus, à user paisiblement des lieux, à souscrire une assurance contre les risques locatifs et à en justifier chaque année, et à assurer l'entretien courant du logement.</p>

  ${d.clauses?`<h3>VII. Clauses particulières</h3><p class="pre">${esc(d.clauses)}</p>`:''}

  <h3>${d.clauses?'VIII':'VII'}. Annexes</h3>
  <ul>${annexes.map(a=>'<li>'+a+'</li>').join('')}</ul>

  <p style="margin-top:24px">Fait à ${v(d.lieuSignature)}, le ${v(fmtDate(d.dateSignature))}, en ${v(d.nbExemplaires,'…')} exemplaires originaux.</p>
  <div class="sign">
    <div><b>Le bailleur</b><br><i>Signature précédée de la mention « Lu et approuvé »</i></div>
    <div><b>Le(s) locataire(s)</b><br><i>Signature précédée de la mention « Lu et approuvé »</i></div>
  </div>`;
}

/* ---------- Défauts ---------- */
function defaults(){
  const now=new Date(),next=new Date(now.getFullYear(),now.getMonth()+1,1,12);
  fill({typeBail:'vide',bailleurType:'physique',logType:'Appartement',dureeVal:3,dureeUnite:'ans',
    dateDebut:next.toISOString().slice(0,10),dateSignature:now.toISOString().slice(0,10),
    chargesType:'provision',jourPaiement:5,modePaiement:'virement bancaire',nbExemplaires:2,mobiliteMotif:'formation professionnelle'});
  $('saved').value='';
}
function applyTypeDefaults(){
  const [n,u]=defaultDuree();f.dureeVal.value=n;f.dureeUnite.value=u;
  if(f.typeBail.value==='mobilite'){f.chargesType.value='forfait';f.depot.value=0;}
  render();
}

/* ---------- Enregistrement local ---------- */
function loadAll(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function saveAll(o){try{localStorage.setItem(KEY,JSON.stringify(o));return true}catch(e){alert('Enregistrement impossible dans ce navigateur.');return false}}
function refreshList(sel){const all=loadAll(),s=$('saved');
  s.innerHTML='<option value="">— Baux enregistrés —</option>'+Object.keys(all).sort().map(k=>`<option>${esc(k)}</option>`).join('');
  if(sel)s.value=sel;}

$('bSave').onclick=()=>{const d=data();
  const def=[d.locataireNom,(d.logAdresse||'').split('\n')[0]].filter(Boolean).join(' — ')||'Bail '+new Date().toLocaleDateString('fr-FR');
  const name=prompt('Nom de ce bail :',$('saved').value||def);if(!name)return;
  const all=loadAll();all[name]=d;if(saveAll(all))refreshList(name);};
$('saved').onchange=e=>{const d=loadAll()[e.target.value];if(d)fill(d);};
$('bDel').onclick=()=>{const k=$('saved').value;if(!k)return alert('Choisis d\'abord un bail enregistré.');
  if(confirm('Supprimer « '+k+' » ?')){const all=loadAll();delete all[k];saveAll(all);refreshList();}};
$('bNew').onclick=()=>{if(confirm('Commencer un nouveau bail vierge ?'))defaults();};
$('bPrint').onclick=()=>window.print();
$('bDepot').onclick=()=>{const t=TYPES[f.typeBail.value];f.depot.value=((+f.loyerHC.value||0)*t.depotMois).toFixed(2);render();};
$('typeBail').addEventListener('change',applyTypeDefaults);
$('bailleurType').addEventListener('change',applyTypeDefaults);
f.addEventListener('input',render);f.addEventListener('change',render);

defaults();refreshList();
</script>
</body>
</html>
